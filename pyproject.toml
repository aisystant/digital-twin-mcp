[project]
name = "digital-twin-mcp"
version = "0.1.0"
description = "Autonomous MCP server for learner digital twins (Python/GCP rewrite)"
requires-python = ">=3.13"
dependencies = [
    # MCP server with Streamable HTTP transport (official SDK; FastMCP lives in mcp.server.fastmcp).
    "mcp>=1.2.0",
    # Ory JWT verification via JWKS.
    "pyjwt[crypto]>=2.10.0",
    # Postgres access (single JSONB document per user; no pgvector for this server).
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-httpserver>=1.1.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
